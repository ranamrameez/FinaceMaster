# Deploys the legacy static root files unchanged, plus the built React app
# (webapp/dist) placed at /webapp/ — assembled into a clean staging
# directory so the raw webapp/ source (webapp/index.html, webapp/src/,
# etc.) never gets uploaded and can't shadow the actual built output at
# that same URL path.
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: webapp/package-lock.json
      - name: Install webapp dependencies
        working-directory: webapp
        run: npm ci
      - name: Build webapp
        working-directory: webapp
        run: npm run build
      - name: Assemble deploy directory
        run: |
          mkdir -p _site
          # Legacy static files at the root, excluding source/dev-only dirs.
          rsync -a --exclude '_site' --exclude 'webapp' --exclude '.github' --exclude '.git' --exclude 'node_modules' ./ _site/
          # Built webapp only (not its source) at /webapp/.
          mkdir -p _site/webapp
          cp -r webapp/dist/. _site/webapp/
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
