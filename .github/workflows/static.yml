# Builds the React app (webapp/) and deploys ONLY its built output
# (webapp/dist) to GitHub Pages, at the site root.
#
# 2026-09-08: this used to `rsync` the ENTIRE repo root into the deploy
# staging directory (minus a short denylist) alongside the built webapp at
# /webapp/ — which meant every other repo-root file was ALSO being served
# publicly by GitHub Pages, including real personal financial data
# snapshots (qse-workbook-backup.json, psx/psx-workbook-backup.json) and
# the legacy static HTML apps (index.html, PSX_Trade_Planner.html,
# Risk_Analysis_Calculator.html) that read/wrote the same Firebase project
# as this app with older, unmaintained logic. Both are real risks: public
# exposure of real financial data, and a stale page silently writing bad
# data into the same database. Fixed by deploying an explicit allowlist
# (webapp/dist only) instead of an implicit denylist over the whole repo.
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: webapp/package-lock.json
      - name: Install webapp dependencies
        working-directory: webapp
        run: npm ci
      - name: Build webapp
        working-directory: webapp
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'webapp/dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
