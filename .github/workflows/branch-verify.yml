name: Branch verify

on:
  push:
    branches: ["chatgpt-bank-account-analytics-scope-20260923"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - name: Install dependencies
        working-directory: webapp
        run: npm ci
      - name: Run tests
        working-directory: webapp
        run: npm test
      - name: Build
        working-directory: webapp
        run: npm run build
